<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<script>(function(){var b=document.createElement('base');b.href=location.origin+(location.hostname.indexOf('github.io')>-1?'/makersco-digital-card/':'/');document.head.appendChild(b);})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="description" content="Ng Zi Jun — RFS Consultants Sdn Bhd | Scan to view digital business card"/>
<title>Ng Zi Jun — RFS Consultants</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --dark:#070504;
  --paper:#fefefe;
  --ink:#171717;
  --ink2:#3d3d3d;
  --company:#82826a;
  --gold-border:#c9a15a;
  --text3:rgba(245,233,214,.34);
  --gold:#C9A96E;
}
html{height:100%}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--dark);
  color:#F5E9D6;
  min-height:100vh;
  min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 20px;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;top:0;left:0;right:0;height:55vh;
  background:radial-gradient(ellipse at 50% -10%,rgba(201,169,110,.07) 0%,transparent 70%);
  pointer-events:none;z-index:0;
}

.card-wrap{
  width:min(620px,92vw);
  aspect-ratio:1855/1131;
  position:relative;z-index:1;
  flex-shrink:0;
}
.card-face{
  position:absolute;top:0;left:0;width:100%;height:100%;
  border-radius:12px;
  background:var(--paper);
  border:3px solid var(--gold-border);
  box-shadow:0 24px 60px rgba(0,0,0,.7);
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;gap:6%;
  padding:5% 6%;
  container-type:inline-size;
}
.qr-img{height:100%;aspect-ratio:1;object-fit:contain;flex-shrink:0}
.qr-info{display:flex;flex-direction:column;justify-content:center;min-width:0}
.qr-name{font-size:6.2cqw;font-weight:800;color:var(--ink);white-space:nowrap;font-family:Verdana,Arial,sans-serif}
.qr-company{font-size:3cqw;font-weight:600;color:var(--company);margin-top:.5em;white-space:nowrap}
.qr-hint{font-size:2.4cqw;color:var(--ink2);margin-top:1.4em;line-height:1.5}
.qr-link{font-size:2.2cqw;color:var(--ink2);margin-top:1em;word-break:break-all}

.flip-caption{font-size:10.5px;color:var(--text3);text-align:center;letter-spacing:.05em;margin:16px 0 4px;position:relative;z-index:1}
.powered{width:min(620px,92vw);margin:18px auto 0;text-align:center;font-size:10px;color:var(--text3);letter-spacing:.06em;position:relative;z-index:1;font-family:'Times New Roman',Times,serif}
.powered span{color:var(--gold);opacity:.8}
</style>
</head>
<body>

<div class="card-wrap">
  <div class="card-face">
    <img class="qr-img" src="src/assets/zijun-qr-code.png" alt="QR code linking to Ng Zi Jun's digital business card"/>
    <div class="qr-info">
      <div class="qr-name">Ng Zi Jun</div>
      <div class="qr-company">RFS Consultants Sdn Bhd</div>
      <div class="qr-hint">Scan to view digital business card, save contact &amp; connect on WhatsApp.</div>
      <a class="qr-link" href="zijun">makersco.github.io/makersco-digital-card/zijun</a>
    </div>
  </div>
</div>

<div class="flip-caption">Scan with your phone camera to open the card</div>
<div class="powered">Powered by <span>Makers Co</span> · Digital Business Cards</div>

</body>
</html>
